<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Post • LYPO</title>
  <meta name="description" content="LYPO blog post." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg">
    <div class="orb o1"></div><div class="orb o2"></div><div class="grid"></div><div class="noise"></div>
  </div>

  <div class="shell">
    <header class="topbar" id="siteHeader"></header>

    <main class="main">
      <section class="card">
        <div class="cardHeader">
          <div class="postTop">
            <h1 class="cardTitle" id="postTitle" style="font-size:20px;">Loading…</h1>
            <div class="hint" id="postMeta" style="margin-top:6px;"></div>
          </div>
        </div>

        <div id="postMedia"></div>
        <div class="postBody" id="postBody"></div>
      </section>
    </main>
  </div>

  <script src="header.js" defer></script>
  <script src="post.js" defer></script>
</body>
</html>
