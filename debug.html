<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Debug Token & Balance</title>
  <style>
    body {
      font-family: monospace;
      background: #1a1a1a;
      color: #fff;
      padding: 20px;
      line-height: 1.6;
    }
    .section {
      margin: 20px 0;
      padding: 20px;
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .success { color: #5f5; }
    .error { color: #f55; }
    .warning { color: #fa5; }
    button {
      background: #5f5;
      color: #000;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      margin: 5px;
    }
    button:hover {
      background: #7f7;
    }
    pre {
      background: #000;
      padding: 15px;
      border-radius: 6px;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <h1>🔍 LYPO Debug Tool</h1>
  
  <div class="section">
    <h2>📦 localStorage Check</h2>
    <div id="localStorageCheck">Checking...</div>
  </div>

  <div class="section">
    <h2>🔑 Token Status</h2>
    <div id="tokenStatus">Checking...</div>
  </div>

  <div class="section">
    <h2>💰 Balance API Test</h2>
    <button onclick="testBalanceAPI()">Test Balance API</button>
    <div id="balanceResult" style="margin-top: 15px;"></div>
  </div>

  <div class="section">
    <h2>🔧 Actions</h2>
    <button onclick="clearToken()">Clear Token</button>
    <button onclick="goToLogin()">Go to Login</button>
    <button onclick="location.reload()">Refresh Page</button>
  </div>

  <script>
    const BACKEND_BASE_URL = "https://lypo-backend.onrender.com";
    const AUTH_TOKEN_KEY = "lypo_token_v1";

    // Check localStorage
    function checkLocalStorage() {
      const output = document.getElementById("localStorageCheck");
      const allKeys = Object.keys(localStorage);
      
      if (allKeys.length === 0) {
        output.innerHTML = '<span class="warning">⚠️ localStorage is empty!</span>';
        return;
      }

      let html = '<div class="success">✅ localStorage has data:</div><pre>';
      allKeys.forEach(key => {
        const value = localStorage.getItem(key);
        const displayValue = value.length > 50 ? value.substring(0, 50) + "..." : value;
        html += `${key}: ${displayValue}\n`;
      });
      html += '</pre>';
      output.innerHTML = html;
    }

    // Check token
    function checkToken() {
      const output = document.getElementById("tokenStatus");
      const token = localStorage.getItem(AUTH_TOKEN_KEY);
      
      if (!token) {
        output.innerHTML = '<span class="error">❌ No token found!</span><br/><small>You need to login first.</small>';
        return;
      }

      // Parse JWT
      try {
        const parts = token.split('.');
        if (parts.length !== 3) {
          output.innerHTML = '<span class="error">❌ Invalid token format!</span>';
          return;
        }

        const payload = JSON.parse(atob(parts[1]));
        const exp = payload.exp ? new Date(payload.exp * 1000) : null;
        const now = new Date();
        const isExpired = exp && exp < now;

        let html = '<div class="success">✅ Token found!</div>';
        html += '<pre>';
        html += `Email: ${payload.email || "N/A"}\n`;
        html += `Issued: ${payload.iat ? new Date(payload.iat * 1000).toLocaleString() : "N/A"}\n`;
        html += `Expires: ${exp ? exp.toLocaleString() : "N/A"}\n`;
        html += `Status: ${isExpired ? '<span class="error">EXPIRED</span>' : '<span class="success">VALID</span>'}\n`;
        html += `Token: ${token.substring(0, 30)}...\n`;
        html += '</pre>';
        
        if (isExpired) {
          html += '<span class="error">⚠️ Token expired! You need to login again.</span>';
        }

        output.innerHTML = html;
      } catch (e) {
        output.innerHTML = `<span class="error">❌ Failed to parse token: ${e.message}</span>`;
      }
    }

    // Test balance API
    async function testBalanceAPI() {
      const output = document.getElementById("balanceResult");
      output.innerHTML = '<div>Loading...</div>';

      const token = localStorage.getItem(AUTH_TOKEN_KEY);
      
      if (!token) {
        output.innerHTML = '<span class="error">❌ No token! Login first.</span>';
        return;
      }

      try {
        console.log("🌐 Fetching:", `${BACKEND_BASE_URL}/api/auth/me`);
        console.log("🔑 Token:", token.substring(0, 30) + "...");

        const res = await fetch(`${BACKEND_BASE_URL}/api/auth/me`, {
          headers: { 
            Authorization: `Bearer ${token}`,
            'Content-Type': 'application/json'
          }
        });

        console.log("📡 Response status:", res.status);

        if (!res.ok) {
          const errorText = await res.text();
          console.error("❌ Error response:", errorText);
          output.innerHTML = `<span class="error">❌ Failed: HTTP ${res.status}</span><pre>${errorText}</pre>`;
          return;
        }

        const data = await res.json();
        console.log("✅ Response data:", data);

        let html = '<div class="success">✅ API Response:</div><pre>';
        html += JSON.stringify(data, null, 2);
        html += '</pre>';

        if (data.user && typeof data.user.credits === "number") {
          html += `<div class="success">💰 Balance: ${data.user.credits} Credits</div>`;
        } else {
          html += '<div class="warning">⚠️ No credits field found in response!</div>';
        }

        output.innerHTML = html;
      } catch (e) {
        console.error("❌ Exception:", e);
        output.innerHTML = `<span class="error">❌ Error: ${e.message}</span>`;
      }
    }

    // Clear token
    function clearToken() {
      if (confirm("Clear token from localStorage?")) {
        localStorage.removeItem(AUTH_TOKEN_KEY);
        alert("Token cleared! Refreshing...");
        location.reload();
      }
    }

    // Go to login
    function goToLogin() {
      window.location.href = "auth.html";
    }

    // Run checks on load
    checkLocalStorage();
    checkToken();
  </script>
</body>
</html>
