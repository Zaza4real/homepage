<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LYPO — Support</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg">
    <div class="orb o1"></div>
    <div class="orb o2"></div>
    <div class="grid"></div>
    <div class="noise"></div>
  </div>

  <header class="header">
    <a class="logoWrap" href="index.html" aria-label="LYPO Home">
      <span class="logo">LYPO<span class="logoTagline">Sounds like magic…</span></span>
    </a>

    <nav class="tabs" role="tablist" aria-label="LYPO tabs">
      <button class="tabBtn" type="button" onclick="location.href='index.html'">Demo</button>
      <button class="tabBtn" type="button" onclick="location.href='index.html?tab=features'">Features</button>
      <button class="tabBtn isActive" type="button" aria-selected="true">Support</button>
      <button class="tabBtn" type="button" onclick="location.href='index.html?tab=docs'">Docs</button>
      <button class="tabBtn" type="button" onclick="location.href='index.html?tab=about'">About</button>
    </nav>

    <div class="headerRight">
      <button class="btnPrimary headerAuthBtn" id="headerAuth" type="button">
        <span class="btnLabel" id="headerAuthLabel">Login</span>
        <span class="btnGlow"></span>
      </button>
    </div>
  </header>

  <main class="container">
    <section class="panel">
      <div class="panelTop">
        <div>
          <h2 style="margin:0;">Support</h2>
          <p class="muted" style="margin:6px 0 0;">Send us a message and we’ll get back to you.</p>
        </div>
      </div>

      <div class="card" style="margin-top:14px;">
        <div class="grid2">
          <label class="field">
            <span class="fieldLabel">Email</span>
            <input id="supportEmail" class="input" type="email" placeholder="you@email.com" autocomplete="email" />
          </label>

          <label class="field">
            <span class="fieldLabel">Subject</span>
            <input id="supportSubject" class="input" type="text" placeholder="Billing, upload issues, etc." />
          </label>
        </div>

        <label class="field" style="margin-top:12px;">
          <span class="fieldLabel">Message</span>
          <input id="supportMessage" class="input" type="text" placeholder="Write your message…" />
        </label>

        <div class="actions" style="margin-top:14px;">
          <button class="btnPrimary" id="btnSupportSend" type="button">
            <span class="btnLabel" id="btnSupportLabel">Send message</span>
            <span class="btnGlow"></span>
          </button>
          <div class="hint" id="supportHint" style="margin-left:10px;"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="support.js"></script>
</body>
</html>
