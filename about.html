<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>About • LYPO</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg">
    <div class="orb o1"></div><div class="orb o2"></div><div class="grid"></div><div class="noise"></div>
  </div>

  <div class="shell">
    <header class="header">
    <a class="logoWrap" href="index.html" aria-label="LYPO Home">
      <span class="logo">LYPO<span class="logoTagline">Sounds like magic…</span></span>
    </a>

    <nav class="tabs" role="tablist" aria-label="LYPO tabs">
      <button class="tabBtn" role="tab" aria-selected="false" data-tab="home" type="button">Demo</button>
      <button class="tabBtn isActive" role="tab" aria-selected="true" data-href="features.html" type="button">Features</button>
      <button class="tabBtn" role="tab" aria-selected="false" data-href="support.html" type="button">Support</button>
      <button class="tabBtn" role="tab" aria-selected="false" data-href="blog.html" type="button">Blog</button>
      <button class="tabBtn isActive" role="tab" aria-selected="false" data-href="about.html" class="tabBtn isActive" role="tab" aria-selected="true" type="button" aria-selected="true"About</button
    </nav>

    <div class="headerRight">
      <a class="btnPrimary headerAuthBtn" href="auth.html" style="text-decoration:none;">
        <span class="btnLabel">Login</span><span class="btnGlow"></span>
      </a>
    </div>
  </header>

    <main class="main">
      <section class="card">
        <div class="cardHeader">
          <h1 class="cardTitle" style="font-size:20px;">About</h1>
          <p class="cardSub">Short, clear info about LYPO.</p>
        </div>

        <div class="postBody">
          <p>LYPO helps you translate and dub videos fast, with natural-sounding results.</p>
          <p>Use the Demo tab to try it, then manage your credits and downloads in the Dashboard.</p>
        </div>
      </section>
    </main>
  </div>

  <script src="script.js" defer></script>
  <script src="header.js" defer></script>

</html>
