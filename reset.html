<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="shortcut icon" href="favicon.ico" />
  
  <title>Reset password • LYPO</title>
  <link rel="stylesheet" href="style.min.css" />
  <link rel="stylesheet" href="mobile-header.min.css" />
  <!-- Google tag (gtag.js) - Google Ads Conversion Tracking -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=AW-16928193692"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'AW-16928193692');

</head>
<body>
  <div id="headerMount"></div>
  <script defer type="module" src="header.min.js"></script>

  <main class="page">
    <div class="container">
      <div class="authCard">
        <section class="card">
          <h2 class="cardTitle">Reset password</h2>
          <p class="muted" style="margin-top:6px;">Enter your new password below.</p>

          <label class="field" style="margin-top:14px;">
            <span class="fieldLabel">New password</span>
            <input id="resetPass1" class="input" type="password" autocomplete="new-password" />
          </label>

          <label class="field" style="margin-top:12px;">
            <span class="fieldLabel">Confirm new password</span>
            <input id="resetPass2" class="input" type="password" autocomplete="new-password" />
          </label>

          <button class="btnPrimary" id="btnDoReset" style="margin-top:14px;">
            <span class="btnLabel">Set new password</span>
          </button>

          <p class="muted" id="resetMsg" style="margin-top:12px;"></p>

          <div class="hr" style="margin:16px 0;"></div>
          <a class="link" href="auth.html">Back to sign in</a>
        </section>
      </div>
    </div>
  </main>

  <script defer src="reset.js"></script>
  <script src="mobile-header.min.js" defer></script>
</body>
</html>
