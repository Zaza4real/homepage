<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset password • LYPO</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="headerMount"></div>
  <script src="header.js" defer>
    <script type="module" src="header.js"></script>

  <main class="page">
    <div class="container">
      <div class="authCard">
        <section class="card">
          <h2 class="cardTitle">Reset password</h2>
          <p class="muted" style="margin-top:6px;">Enter your new password below.</p>

          <label class="field" style="margin-top:14px;">
            <span class="fieldLabel">New password</span>
            <input id="resetPass1" class="input" type="password" autocomplete="new-password" />
          </label>

          <label class="field" style="margin-top:12px;">
            <span class="fieldLabel">Confirm new password</span>
            <input id="resetPass2" class="input" type="password" autocomplete="new-password" />
          </label>

          <button class="btnPrimary" id="btnDoReset" style="margin-top:14px;">
            <span class="btnLabel">Set new password</span>
          </button>

          <p class="muted" id="resetMsg" style="margin-top:12px;"></p>

          <div class="hr" style="margin:16px 0;"></div>
          <a class="link" href="auth.html">Back to sign in</a>
        </section>
      </div>
    </div>
  </main>

  <script src="reset.js"></script>

<footer class="site-footer">
  <div class="footer-inner">
    <span>© 2026 Lypo</span>
    <div class="footer-links">
      <a href="terms.html">Terms</a>
      <a href="privacy.html">Privacy</a>
    </div>
  </div>
</footer>

</body>
</html>
