<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Account • LYPO</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg">
    <div class="orb o1"></div>
    <div class="orb o2"></div>
    <div class="grid"></div>
    <div class="noise"></div>
  </div>

  <div class="shell">
    <header class="header">
    <a class="logoWrap" href="#" aria-label="LYPO Home" data-go="home">
      <span class="logo">LYPO<span class="logoTagline">Sounds like magic…</span></span>
    </a>

    <nav class="tabs" role="tablist" aria-label="LYPO tabs">
      <button class="tabBtn isActive" role="tab" aria-selected="true" data-tab="home" type="button">Demo</button>
      <button class="tabBtn" role="tab" aria-selected="false" data-tab="features" type="button">Features</button>
      <button class="tabBtn" role="tab" aria-selected="false" data-tab="pricing" type="button">Pricing</button>
      <button class="tabBtn" role="tab" aria-selected="false" data-tab="docs" type="button">Docs</button>
      <button class="tabBtn" role="tab" aria-selected="false" data-tab="about" type="button">About</button>
    </nav>

    <div class="headerRight">
      <button class="btnPrimary headerAuthBtn" id="headerAuth" data-auth-page="1" type="button">
        <span class="btnLabel" id="headerAuthLabel">Login</span>
        <span class="btnGlow"></span>
      </button>
    </div>
  </header>

    <main class="main">
      <section class="card">
        <div class="cardHeader">
          <h2 class="cardTitle">Sign in or create an account</h2>
          <p class="cardSub">Use your email + password to buy credits and upload videos.</p>
        </div>

        <div class="grid2">
          <label class="field">
            <span class="fieldLabel">Email</span>
            <input id="authEmailPage" class="input" type="email" placeholder="you@email.com" autocomplete="email" />
          </label>

          <label class="field">
            <span class="fieldLabel">Password</span>
            <input id="authPassPage" class="input" type="password" placeholder="••••••••" autocomplete="current-password" />
          </label>
          <div style="margin-top:6px; display:flex; justify-content:flex-end;">
            <button id="btnForgotPage" type="button" style="background:none;border:none;padding:0;color:rgba(255,255,255,.85);text-decoration:underline;cursor:pointer;font:inherit;">
              Forgot password?
            </button>
          </div>

          <div id="resetWrap" style="display:none; margin-top:14px;">
            <div style="font-size:12px; opacity:.85; margin-bottom:10px;">Set a new password</div>
            <label class="field">
              <span class="fieldLabel">New password</span>
              <input id="resetPass1" class="inp" type="password" autocomplete="new-password" placeholder="New password" />
            </label>
            <label class="field">
              <span class="fieldLabel">Confirm new password</span>
              <input id="resetPass2" class="inp" type="password" autocomplete="new-password" placeholder="Confirm new password" />
            </label>
            <button class="btnPrimary" id="btnResetPass" type="button" style="width:100%; margin-top:10px;">
              <span class="btnLabel">Reset password</span><span class="btnGlow"></span>
            </button>
          </div>

        </div>

        <div id="authMsgPage" class="hint" style="min-height:18px; margin-top:10px; color: rgba(255,255,255,.75); font-size:12px;"></div>

        <div class="actions" style="margin-top:14px;">
          <button class="btnPrimary" id="btnLoginPage" type="button">
            <span class="btnLabel">Login</span><span class="btnGlow"></span>
          </button>
          <button class="btnGhost" id="btnSignupPage" type="button">
            <span class="btnLabel">Create account</span><span class="btnGlow"></span>
          </button>
        </div>

        <div class="hint" style="margin-top:10px; font-size:12px;">
          After success you’ll be redirected back to the homepage.
        </div>
      </section>
    </main>
  </div>

  <script src="auth.js" defer></script>
</body>
</html>
