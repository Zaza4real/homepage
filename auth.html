<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Account • LYPO</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="bg">
    <div class="orb o1"></div>
    <div class="orb o2"></div>
    <div class="grid"></div>
    <div class="noise"></div>
  </div>

  <header class="header">
    <a class="logoWrap" href="index.html" aria-label="LYPO Home">
      <span class="logo">LYPO<span class="logoTagline">Sounds like magic…</span></span>
    </a>

    <nav class="tabs" role="tablist" aria-label="Account tabs">
      <button class="tabBtn isActive" role="tab" aria-selected="true" type="button">Account</button>
    </nav>

    <div class="headerRight">
      <a class="btnGhost headerAuthBtn" href="index.html" style="text-decoration:none; display:inline-flex; align-items:center; gap:10px;">
        <span class="btnLabel">Home</span><span class="btnGlow"></span>
      </a>
    </div>
  </header>

  <main class="container">
    <section class="tabPanel isActive" id="tab-account" role="tabpanel">
      <div class="hero">
        <h1 class="h1">Account</h1>
        <p class="sub">Sign in (or create an account) to buy credits and upload videos.</p>

        <div class="demoCard">
          <div class="demoTop">
            <div class="demoTitle">Sign in</div>
            <div class="chips"><span class="chip">Secure ✓</span></div>
          </div>
          <div class="demoBody">
            <div class="form">
              <div class="grid2">
                <label class="field" style="grid-column: span 6;">
                  <span>Email</span>
                  <input id="authEmailPage" type="email" placeholder="you@email.com" autocomplete="email" />
                </label>
                <label class="field" style="grid-column: span 6;">
                  <span>Password</span>
                  <input id="authPassPage" type="password" placeholder="••••••••" autocomplete="current-password" />
                </label>
              </div>

              <div id="authMsgPage" class="hint" style="min-height:18px; margin-top:10px; color: rgba(255,255,255,.75); font-size:12px;"></div>

              <div class="actions" style="margin-top:6px;">
                <button class="btnPrimary" id="btnLoginPage" type="button"><span class="btnLabel">Login</span><span class="btnGlow"></span></button>
                <button class="btnGhost" id="btnSignupPage" type="button"><span class="btnLabel">Create account</span><span class="btnGlow"></span></button>
              </div>

              <div class="hint" style="margin-top:10px; font-size:12px;">After success you’ll be redirected back to the homepage.</div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <footer class="footer">
      <span>© <span id="year"></span> LYPO</span>
      <span class="muted">Account</span>
    </footer>
  </main>

  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
  <script src="auth.js" defer></script>
</body>
</html>
