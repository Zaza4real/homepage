<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  
  <!-- Security Headers (only those valid in meta tags) -->
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="shortcut icon" href="favicon.ico" />
  
  <title>Sign In • LYPO</title>
  <meta name="description" content="Sign in or create your LYPO account to start translating videos." />
  
  <!-- DNS Prefetch & Preconnect -->
  <link rel="dns-prefetch" href="//accounts.google.com" />
  <link rel="dns-prefetch" href="//lypo-backend.onrender.com" />
  <link rel="preconnect" href="https://accounts.google.com" crossorigin />
  <link rel="preconnect" href="https://lypo-backend.onrender.com" crossorigin />
  
  <!-- Preload critical resources -->
  <link rel="preload" href="style.min.css" as="style" />
  <link rel="stylesheet" href="mobile-header.min.css" />
  <link rel="preload" href="auth.js" as="script" />
  
  <link rel="stylesheet" href="style.min.css" />
  <link rel="stylesheet" href="mobile-header.min.css" />
  
  <!-- Analytics -->
  <script src="analytics.min.js" defer></script>
  
  <!-- Google Sign-In (Only loaded on auth page) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!-- Google tag (gtag.js) - Google Analytics 4 & Google Ads -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-FG0Q52LT2K"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-FG0Q52LT2K');
    gtag('config', 'AW-16928193692');
  </script>

</head>
<body>
  <!-- Background -->
  <div class="bg">
    <div class="orb o1"></div>
    <div class="orb o2"></div>
    <div class="grid"></div>
    <div class="noise"></div>
  </div>

  <!-- Main Container -->
  <div class="shell">
    <!-- Header -->
    <header class="topbar">
      <div class="brand">
        <div class="brandTxt">
          <div class="brandName">LYPO</div>
          <div class="brandTag">Account</div>
        </div>
      </div>

      <div class="headerRight">
        <a class="btnPrimary headerAuthBtn" href="index.html" style="text-decoration:none; display:inline-flex; align-items:center; gap:10px;" aria-label="Back to home">
          <span class="btnLabel">← Back</span>
          <span class="btnGlow" aria-hidden="true"></span>
        </a>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main">
      <section class="card">
        <!-- Card Header -->
        <div class="cardHeader">
          <h1 class="cardTitle" style="font-size: 28px; font-weight: 900; margin: 0 0 8px 0;">Welcome to LYPO</h1>
          <p class="cardSub" style="font-size: 15px; opacity: 0.8; margin: 0;">Sign in to your account or create a new one to get started.</p>
        </div>

        <!-- Auth Form -->
        <div class="authForm">
          <!-- Email Field -->
          <label class="field">
            <span class="fieldLabel">Email address</span>
            <input 
              id="authEmailPage" 
              class="input" 
              type="email" 
              placeholder="you@example.com" 
              autocomplete="email"
              aria-label="Email address"
              aria-required="true"
            />
          </label>

          <!-- Password Field -->
          <label class="field">
            <span class="fieldLabel">Password</span>
            <input 
              id="authPassPage" 
              class="input" 
              type="password" 
              placeholder="••••••••" 
              autocomplete="current-password"
              aria-label="Password"
              aria-required="true"
            />
          </label>

          <!-- Confirm Password Field (for signup) -->
          <label class="field" id="confirmPassWrap" style="display:none;">
            <span class="fieldLabel">Confirm password</span>
            <input 
              id="authPass2Page" 
              class="input" 
              type="password" 
              placeholder="••••••••" 
              autocomplete="new-password"
              aria-label="Confirm password"
            />
          </label>

          <!-- Forgot Password Link -->
          <div style="margin-top: 8px; display: flex; justify-content: flex-end;">
            <button 
              id="btnForgotPage" 
              type="button" 
              style="background:none; border:none; padding:4px 0; color:rgba(255,255,255,.85); text-decoration:underline; cursor:pointer; font:inherit; font-size:13px;"
              aria-label="Forgot password"
            >
              Forgot password?
            </button>
          </div>

          <!-- Reset Password Section (hidden by default) -->
          <div id="resetWrap" style="display:none; margin-top:20px;">
            <div style="font-size:14px; font-weight:600; margin-bottom:14px; color:rgba(255,255,255,.9);">Reset your password</div>
            
            <label class="field">
              <span class="fieldLabel">New password</span>
              <input 
                id="resetPass1" 
                class="input" 
                type="password" 
                autocomplete="new-password" 
                placeholder="Enter new password"
                aria-label="New password"
              />
            </label>
            
            <label class="field">
              <span class="fieldLabel">Confirm new password</span>
              <input 
                id="resetPass2" 
                class="input" 
                type="password" 
                autocomplete="new-password" 
                placeholder="Confirm new password"
                aria-label="Confirm new password"
              />
            </label>
            
            <button class="btnPrimary" id="btnResetPass" type="button" style="width:100%; margin-top:16px;">
              <span class="btnLabel">Reset Password</span>
              <span class="btnGlow" aria-hidden="true"></span>
            </button>
          </div>
        </div>

        <!-- Message Area (NO FLICKERING) -->
        <div 
          id="authMsgPage" 
          role="alert" 
          aria-live="polite" 
          style="min-height:20px; margin:16px 0 0 0; font-size:14px; font-weight:500; line-height:1.6; opacity: 0; transition: opacity 0.15s ease;"
        ></div>

        <!-- Password Requirements Help - REMOVED (causing random appearance) -->

        <!-- Action Buttons -->
        <div class="actions" style="margin-top:20px; gap:12px;">
          <button class="btnPrimary" id="btnLoginPage" type="button" aria-label="Sign in">
            <span class="btnLabel">Sign In</span>
            <span class="btnGlow" aria-hidden="true"></span>
          </button>
          <button class="btnGhost" id="btnSignupPage" type="button" aria-label="Create account">
            <span class="btnLabel">Create Account</span>
            <span class="btnGlow" aria-hidden="true"></span>
          </button>
        </div>

        <!-- Divider -->
        <div style="position:relative; margin:24px 0;">
          <div style="position:absolute; top:50%; left:0; right:0; height:1px; background:rgba(255,255,255,.08);"></div>
          <div style="position:relative; text-align:center; background:rgba(0,0,0,.95); padding:0;">
            <span style="background:rgba(0,0,0,.95); padding:0 16px; font-size:13px; color:rgba(255,255,255,.5); font-weight:500;">or continue with</span>
          </div>
        </div>

        <!-- Google Sign-In Button -->
        <div id="googleSignInBtn" style="display:flex; justify-content:center; margin-top:16px;"></div>

        <!-- Footer Note -->
        <div class="hint" style="margin-top:16px; font-size:13px; text-align:center; opacity:.7;">
          By signing in, you agree to our <a href="terms.html" style="color:rgba(255,255,255,.9); text-decoration:underline;">Terms</a> and <a href="privacy.html" style="color:rgba(255,255,255,.9); text-decoration:underline;">Privacy Policy</a>
        </div>
      </section>
    </main>
  </div>

  <!-- Scripts -->
  <script src="auth.min.js" defer></script>
  <script src="mobile-header.js" defer></script>
</body>
</html>
